<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satella — Fürsət Zonaları</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#185FA5; --navy:#26215C; --blue-lt:#E6F1FB; --blue-md:#7FA8D4;
    --green:#1D9E75; --green-lt:#E1F5EE; --neutral:#F1EFE8; --card:#F7F6F1;
    --gray:#5F5E5A; --white:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',sans-serif;color:var(--navy);background:var(--neutral);height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:340px 1fr;height:100vh}
  .panel{background:var(--white);border-right:1px solid #E4E2D8;display:flex;flex-direction:column;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:20px 22px;border-bottom:1px solid #E4E2D8}
  .brand h1{font-family:'Montserrat';font-weight:800;font-size:22px;color:var(--navy);letter-spacing:.5px}
  .brand span{font-size:11px;color:var(--green);font-weight:600;letter-spacing:1px;text-transform:uppercase;display:block;margin-top:2px}
  .section{padding:18px 22px;border-bottom:1px solid #F0EEE6}
  .label{font-family:'Montserrat';font-weight:700;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .label::before{content:"";width:14px;height:14px;border-radius:3px;background:var(--green);flex:0 0 auto}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cats3{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .cats3 .cat{padding:12px 6px}
  .cats3 .cat .ico{font-size:22px}
  .cats3 .cat .nm{font-size:12.5px}
  .cat{border:1.5px solid #E4E2D8;background:var(--card);border-radius:12px;padding:14px 12px;cursor:pointer;text-align:center;transition:all .15s;font-weight:500}
  .cat:hover{border-color:var(--blue-md)}
  .cat.active{border-color:var(--green);background:var(--green-lt);color:var(--navy)}
  .cat .ico{font-size:24px;display:block;margin-bottom:5px}
  .cat .nm{font-size:14px;font-weight:600}
  .radius-val{font-family:'Montserrat';font-weight:800;font-size:32px;color:var(--blue)}
  .radius-val small{font-size:15px;color:var(--gray);font-weight:500}
  input[type=range]{width:100%;margin-top:10px;accent-color:var(--green);height:6px}
  .range-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--gray);margin-top:4px}
  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px;color:var(--navy);font-weight:500}
  .toggle input{width:0;height:0;opacity:0;position:absolute}
  .switch{width:42px;height:24px;background:#D3D1C7;border-radius:12px;position:relative;transition:background .18s;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .18s}
  .toggle input:checked + .switch{background:var(--green)}
  .toggle input:checked + .switch::after{transform:translateX(18px)}
  .toggle-hint{font-size:11.5px;color:var(--gray);margin-top:6px;line-height:1.4}
  .hint{font-size:13px;color:var(--gray);line-height:1.5;background:var(--blue-lt);border-radius:10px;padding:12px 14px}
  .hint b{color:var(--blue)}
  .btn{margin:18px 22px 8px;padding:13px;background:var(--green);color:#fff;border:none;border-radius:12px;font-family:'Montserrat';font-weight:700;font-size:15px;letter-spacing:.5px;cursor:pointer}
  .results{padding:0 22px 22px}
  .res-head{font-family:'Montserrat';font-weight:700;font-size:13px;color:var(--navy);margin:6px 0 12px;letter-spacing:.5px}
  .zone{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;background:var(--card);margin-bottom:8px;cursor:pointer;border:1px solid transparent;transition:all .12s}
  .zone:hover{border-color:var(--green);transform:translateX(2px)}
  .zone .rank{font-family:'Montserrat';font-weight:800;font-size:15px;color:#fff;background:var(--blue);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .zone.top .rank{background:var(--green)}
  .zone .meta{flex:1;min-width:0}
  .zone .sc{font-family:'Montserrat';font-weight:700;font-size:16px;color:var(--navy)}
  .zone .sub{font-size:11.5px;color:var(--gray);margin-top:1px}
  .zone .grow{font-size:10.5px;color:var(--green);font-weight:600;margin-top:2px}
  #map{height:100vh;width:100%}
  .leaflet-popup-content{font-family:'Poppins';font-size:13px;line-height:1.55}
  .leaflet-popup-content b{font-family:'Montserrat';color:var(--navy)}
  .bar{height:5px;border-radius:3px;background:#E0DED4;margin:3px 0 6px;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--green)}
  .bar.gr>span{background:var(--blue)}
  .empty{padding:36px 22px;text-align:center;color:var(--gray);font-size:14px;line-height:1.6}
  .empty .big{font-size:32px;margin-bottom:10px}
  @media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}#map{height:60vh}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <a class="brand" href="index.html" style="text-decoration:none">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="14" fill="none" stroke="#185FA5" stroke-width="2.2"/>
        <ellipse cx="20" cy="20" rx="14" ry="5.6" fill="none" stroke="#1D9E75" stroke-width="1.8" transform="rotate(-30 20 20)"/>
        <circle cx="20" cy="20" r="3.6" fill="#185FA5"/>
      </svg>
      <div><h1>Satella</h1><span>Opportunity Intelligence</span></div>
    </a>

    <div class="section">
      <div class="label">1 · Kateqoriya</div>
      <div class="cats cats3">
        <div class="cat active" data-cat="pharmacy"><span class="ico">💊</span><span class="nm">Aptek</span></div>
        <div class="cat" data-cat="supermarket"><span class="ico">🛒</span><span class="nm">Market</span></div>
        <div class="cat" data-cat="restaurant"><span class="ico">🍽️</span><span class="nm">Restoran</span></div>
      </div>
    </div>

    <div class="section">
      <div class="label">2 · Radius</div>
      <div class="radius-val" id="radVal">2.5<small> km</small></div>
      <input type="range" id="radius" min="0.5" max="8" step="0.5" value="2.5">
      <div class="range-labels"><span>0.5 km</span><span>8 km</span></div>
    </div>

    <div class="section">
      <div class="label">3 · İnkişaf filtri</div>
      <label class="toggle">
        <input type="checkbox" id="growthOnly">
        <span class="switch"></span>
        <span>Yalnız inkişaf edən zonalar</span>
      </label>
      <div class="toggle-hint">Aktivləşdirsən, yalnız peyk datası ilə böyüməsi yüksək olan zonalar göstərilir.</div>
    </div>

    <div class="section">
      <div class="label">4 · Mərkəz</div>
      <div class="hint" id="hint">Xəritədə istənilən yerə <b>klik et</b> — maraq sahənin mərkəzini seç.</div>
    </div>

    <div class="results" id="results"></div>
  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let DATA=null, category="pharmacy", radiusKm=2.5, center=null, growthOnly=false;
let centerMarker=null, radiusCircle=null, hexLayer=L.layerGroup();

const map = L.map('map').setView([40.395,49.87],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {attribution:'© OpenStreetMap © CARTO',maxZoom:19}).addTo(map);
hexLayer.addTo(map);

fetch('satella_hexagons.json').then(r=>r.json()).then(d=>{DATA=d;if(center)run();})
  .catch(()=>{document.getElementById('results').innerHTML=
    '<div class="empty"><div class="big">📂</div>satella_hexagons.json tapılmadı.<br>Faylı bu səhifə ilə eyni qovluğa qoy.</div>';});

document.querySelectorAll('.cat').forEach(c=>{c.onclick=()=>{
  document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  c.classList.add('active');category=c.dataset.cat;if(center&&DATA)run();};});

const rad=document.getElementById('radius'),radVal=document.getElementById('radVal');
rad.oninput=()=>{radiusKm=parseFloat(rad.value);radVal.innerHTML=radiusKm.toFixed(1)+'<small> km</small>';
  if(center){drawCenter();if(DATA)run();}};

document.getElementById('growthOnly').onchange=(e)=>{growthOnly=e.target.checked;if(center&&DATA)run();};

map.on('click',e=>{center={lat:e.latlng.lat,lon:e.latlng.lng};drawCenter();
  document.getElementById('hint').innerHTML='Mərkəz seçildi ✓ — radiusu dəyiş və ya <b>yenidən klik et</b>.';
  if(DATA)run();});

function drawCenter(){
  if(centerMarker)map.removeLayer(centerMarker);
  if(radiusCircle)map.removeLayer(radiusCircle);
  const icon=L.divIcon({className:'',html:'<div style="font-size:26px;transform:translate(-13px,-24px)">📍</div>',iconSize:[0,0]});
  centerMarker=L.marker([center.lat,center.lon],{icon}).addTo(map);
  radiusCircle=L.circle([center.lat,center.lon],{radius:radiusKm*1000,color:'#185FA5',weight:2,dashArray:'6',fill:false}).addTo(map);
}
function distKm(la1,lo1,la2,lo2){const R=6371,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;
  return R*2*Math.asin(Math.sqrt(a));}
function color(s,mn,mx){const t=mx>mn?(s-mn)/(mx-mn):0.5;const c1=[201,217,236],c2=[29,158,117];
  const c=c1.map((v,i)=>Math.round(v+(c2[i]-v)*t));return`rgb(${c[0]},${c[1]},${c[2]})`;}

function run(){
  const rows=DATA[category]||[];
  let inArea=rows.map(r=>({...r,dist:distKm(center.lat,center.lon,r.lat,r.lon)}))
                 .filter(r=>r.dist<=radiusKm);
  if(growthOnly) inArea=inArea.filter(r=>r.c_growth>=60);  // inkişaf filtri
  hexLayer.clearLayers();
  const res=document.getElementById('results');
  if(inArea.length===0){
    res.innerHTML='<div class="empty"><div class="big">🔍</div>'+
      (growthOnly?'Bu sahədə yüksək inkişaflı zona yoxdur. Filtri söndür və ya radiusu artır.'
                 :'Bu sahədə skorlanmış zona yoxdur. Radiusu artır və ya başqa mərkəz seç.')+'</div>';
    return;
  }
  const scores=inArea.map(r=>r.score),mn=Math.min(...scores),mx=Math.max(...scores);
  inArea.forEach(r=>{L.polygon(r.boundary,{color:'#fff',weight:.5,fillColor:color(r.score,mn,mx),fillOpacity:.5}).addTo(hexLayer);});
  const top=[...inArea].sort((a,b)=>b.score-a.score).slice(0,10);
  top.forEach((r,i)=>{
    const p=L.polygon(r.boundary,{color:'#1D9E75',weight:2.5,fillColor:color(r.score,mn,mx),fillOpacity:.82}).addTo(hexLayer);
    p.bindPopup(popupHtml(r,i+1));r._layer=p;});
  res.innerHTML='<div class="res-head">TÖVSİYƏ OLUNAN ZONALAR ('+inArea.length+' zonadan top '+top.length+')</div>'+
    top.map((r,i)=>`<div class="zone ${i<3?'top':''}" data-i="${i}">
      <div class="rank">${i+1}</div>
      <div class="meta"><div class="sc">${r.score} bal</div>
      <div class="sub">${r.dist.toFixed(1)} km · əhali ${r.pop.toLocaleString()}</div>
      ${r.c_growth>=60?'<div class="grow">↗ inkişaf edən zona</div>':''}</div></div>`).join('');
  res.querySelectorAll('.zone').forEach(z=>{z.onclick=()=>{const r=top[+z.dataset.i];
    map.setView([r.lat,r.lon],15);r._layer.openPopup();};});
}
function popupHtml(r,rank){
  const bar=(lab,v,cls='')=>`<div style="font-size:11px;color:#5F5E5A">${lab}</div><div class="bar ${cls}"><span style="width:${v}%"></span></div>`;
  // yaş nisbəti — hansı üstünlük təşkil edir
  let ageLine = '';
  if(r.young_pct !== undefined){
    const dom = r.young_pct >= 55 ? 'gənc əhali üstünlük təşkil edir'
              : r.elderly_pct >= 55 ? 'yaşlı əhali üstünlük təşkil edir'
              : 'qarışıq yaş strukturu';
    ageLine = `<div style="font-size:11px;color:#185FA5;margin:2px 0 8px">
      Gənc (20-44): ${r.young_pct}% · Yaşlı (50+): ${r.elderly_pct}%<br>
      <span style="color:#1D9E75">↳ ${dom}</span></div>`;
  }
  return `<b>#${rank} — ${r.score} bal</b><br>Mərkəzdən: ${r.dist.toFixed(1)} km · Əhali: ${r.pop.toLocaleString()}
    ${ageLine}
    ${bar('Əhali',r.c_pop)}${bar('Az rəqib',r.c_comp)}${bar('Əlçatanlıq',r.c_acc)}${bar('Sıxlıq',r.c_dens)}
    ${bar('Böyümə (peyk)',r.c_growth,'gr')}`;
}
</script>
</body>
</html>
